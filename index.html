<!doctype html>
<html lang="ms">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#173b68">
<title>e-Laporan Harian | SMadJiwa</title>
<style>
:root{--navy:#073568;--blue:#245b91;--bg:#f1f5f9;--line:#dbe3ee}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:#172033}
header{
  min-height:64px;background:#073568;color:#fff;
  display:flex;align-items:center;gap:12px;padding:7px 12px;
}
.brand{display:flex;align-items:center;gap:12px;min-width:0;flex:1}
.logo{width:48px;height:48px;object-fit:contain;object-position:center;display:block;flex:0 0 48px}
.brand-copy{min-width:0}
.school{font-size:14px;line-height:1.1;font-weight:800;margin:0;color:#fff}
.heading{font-size:14px;font-weight:800;margin:3px 0 0;color:#ffdf00;letter-spacing:.2px}
.subheading{font-size:9px;letter-spacing:.45px;margin:2px 0 0;color:#dbeafe;opacity:.95}
.tabs{display:flex;gap:8px;padding:0;margin:0;align-items:center;flex:0 0 auto;background:transparent}
.tab{flex:0 1 auto;min-width:132px;border:1px solid var(--line);background:white;color:#172f50;border-radius:5px;padding:9px 12px;font-weight:800;font-size:12px;cursor:pointer;min-height:36px;white-space:nowrap}
#tab-guru{background:#ffc928;color:#111;border:2px solid #fff}
#tab-warden{background:#79e58a;color:#111;border:2px solid #fff}
.tab.active{outline:2px solid #111;outline-offset:-2px;filter:brightness(.96)}
main{max-width:1600px;margin:auto;padding:0 8px 12px}
.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:8px;overflow:hidden;min-height:calc(100vh - 112px)}
.panel.active{display:block}
.subtabs{display:flex;gap:5px;padding:5px 7px;background:#eaf0f7;border-bottom:1px solid var(--line);flex-wrap:wrap}
.subtab{border:0;border-radius:6px;padding:7px 11px;background:#fff;color:#24364b;font-weight:700;font-size:12px;cursor:pointer}
.subtab.active{background:#245b91;color:white}
.framewrap{height:calc(100vh - 112px);min-height:420px}
iframe{width:100%;height:100%;border:0;display:block;background:white}
.notice{padding:14px;margin:10px;border:1px dashed #b6c5d8;border-radius:8px;background:#f8fbff;color:#475569;line-height:1.45}
.notice a{color:#1558a6;font-weight:700}
.loading{padding:30px;text-align:center;color:#64748b}
footer{text-align:center;color:#64748b;font-size:10px;padding:5px}
@media(max-width:760px){
  header{gap:8px;padding:7px 9px;flex-wrap:wrap}
  .brand{gap:7px;flex:1 1 100%}
  .logo{width:40px;height:40px;flex-basis:40px}
  .school{font-size:10px}
  .heading{font-size:11px}
  .subheading{font-size:7px;letter-spacing:.2px}
  .tabs{width:100%;gap:5px}
  .tab{flex:1;min-width:0;font-size:10px;padding:7px 3px;min-height:34px}
  .framewrap{height:calc(100vh - 100px);min-height:400px}
  .subtab{font-size:11px;padding:7px 9px}
  .panel{min-height:calc(100vh - 100px)}
}
@media(max-width:390px){
  .school{font-size:9px}
  .heading{font-size:10px}
  .subheading{display:none}
  .tab{font-size:9px}
}
</style>
</head>
<body>
<header>
  <div class="brand">
    <img class="logo" src="https://mylink.la/storage/avatars/a7/51148-a7263e64de7d87e7.png" alt="Logo Sekolah Menengah Sains Sultan Mohamad Jiwa" width="48" height="48" loading="eager" decoding="async">
    <div class="brand-copy">
      <h1 class="school">SEKOLAH MENENGAH SAINS SULTAN MOHAMAD JIWA</h1>
      <div class="heading">e-LAPORAN HARIAN SMADJIWA 2026</div>
      <p class="subheading">SISTEM PELAPORAN BERSEPADU SMADJIWA</p>
    </div>
  </div>
  <nav class="tabs" role="tablist">
    <button class="tab active" id="tab-guru" onclick="selectMain('guru')">📋 GURU BERTUGAS</button>
    <button class="tab" id="tab-warden" onclick="selectMain('warden')">🛡️ WARDEN BERTUGAS</button>
  </nav>
</header>

<main>
  <section class="panel active" id="panel-guru">
    <div class="subtabs">
      <button class="subtab active" id="guru-form-btn" onclick="selectGuru('form')">Borang Laporan Guru</button>
      <button class="subtab" id="guru-record-btn" onclick="selectGuru('record')">Rekod Pelaporan</button>
    </div>
    <div class="framewrap">
      <iframe id="guru-frame" title="Modul Guru Bertugas" src="guru.html"></iframe>
    </div>
  </section>

  <section class="panel" id="panel-warden">
    <div class="subtabs">
      <button class="subtab active" id="warden-form-btn" onclick="selectWarden('form')">Borang Warden</button>
      <button class="subtab" id="warden-dashboard-btn" onclick="selectWarden('dashboard')">Dashboard Warden</button>
    </div>
    
    <div class="framewrap">
      <iframe id="warden-frame" title="Modul Warden Bertugas" src="warden.html"></iframe>
    </div>
  </section>
</main>
<footer>© SMadJiwa · e-Laporan Harian</footer>

<script>
const WARDEN_FORM='warden.html';
const WARDEN_DASH='https://script.google.com/macros/s/AKfycbxQZxZ45iAHdpqreZ7opIqaVCH6tunNyPM_UAtxLZKJBBwwu2rTTFS6k7vEzOjbwizroA/exec?v=dashboard';

function selectMain(which){
  ['guru','warden'].forEach(id=>{
    document.getElementById('panel-'+id).classList.toggle('active',id===which);
    document.getElementById('tab-'+id).classList.toggle('active',id===which);
  });
}
function selectGuru(which){
  const frame=document.getElementById('guru-frame');
  frame.src=which==='form'?'guru.html':'rekod-guru.html';
  document.getElementById('guru-form-btn').classList.toggle('active',which==='form');
  document.getElementById('guru-record-btn').classList.toggle('active',which==='record');
}
function selectWarden(which){
  const url=which==='form'?WARDEN_FORM:WARDEN_DASH;
  const frame=document.getElementById('warden-frame');
  frame.src=url;
  document.getElementById('warden-open-link').href=WARDEN_FORM;
  document.getElementById('warden-dashboard-link').href=WARDEN_DASH;
  document.getElementById('warden-form-btn').classList.toggle('active',which==='form');
  document.getElementById('warden-dashboard-btn').classList.toggle('active',which==='dashboard');
}
// Borang Warden dimuatkan daripada fail statik warden.html di GitHub Pages.
// Dashboard Warden kekal menggunakan deployment GAS sedia ada.
</script>
</body>
</html>
