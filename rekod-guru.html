<!doctype html>
<html lang="ms">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rekod Pelaporan SMadJiwa 2026</title>
  <script src="https://cdn.tailwindcss.com/3.4.17"></script>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@700&family=Open+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Open Sans', sans-serif; background-color: #f1f5f9; }
    .header-font { font-family: 'Merriweather', serif; }
    .loader { border: 4px solid #f3f3f3; border-top: 4px solid #1e40af; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 20px auto; }
    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
  </style>
</head>
<body class="p-4 sm:p-8">
  <div class="max-w-6xl mx-auto">
    <div class="bg-white rounded-2xl shadow-xl min-h-screen overflow-hidden border border-gray-200">
        
        <!-- HEADER -->
        <div class="p-6 border-b bg-white flex flex-col sm:flex-row justify-between items-center gap-6">
            <div>
                <h2 class="text-3xl font-bold text-blue-900 header-font">Rekod Pelaporan</h2>
                <p class="text-gray-500 text-xs font-bold uppercase tracking-widest mt-1">GURU BERTUGAS HARIAN SMadJiwa 2026</p>
            </div>
            
            <div class="flex gap-3 items-center">
                 <select id="monthFilter" onchange="renderReports()" class="border-2 border-blue-900 rounded-lg px-4 py-2 bg-white text-blue-900 font-bold outline-none shadow-sm focus:ring-2 focus:ring-blue-500">
                    <option value="01">Januari</option><option value="02">Februari</option><option value="03">Mac</option>
                    <option value="04">April</option><option value="05">Mei</option><option value="06">Jun</option>
                    <option value="07">Julai</option><option value="08">Ogos</option><option value="09">September</option>
                    <option value="10">Oktober</option><option value="11">November</option><option value="12">Disember</option>
                 </select>
                 <button onclick="fetchReports()" class="bg-blue-600 text-white px-4 py-2.5 rounded-lg font-bold shadow hover:bg-blue-700 transition active:scale-95">🔄 Refresh</button>
            </div>
        </div>

        <!-- CONTENT -->
        <div id="reports-container" class="p-6 sm:p-8 space-y-10">
            <div class="text-center py-20">
                <div class="loader"></div>
                <p class="text-gray-400 font-medium">Menghubungi pangkalan data...</p>
            </div>
        </div>
    </div>
  </div>

  <script>
    // URL Web App anda
    const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzqdw95BYuwMgY9-B7fisoMKayLL8OWirINdHIgah-T-mfw2X4CssJaMykkgeyM7JOB/exec'; 
    let reportsData = [];

    window.onload = function() {
        const mm = String(new Date().getMonth() + 1).padStart(2, '0');
        document.getElementById('monthFilter').value = mm;
        fetchReports();
    };

    async function fetchReports() {
        const container = document.getElementById('reports-container');
        container.innerHTML = '<div class="loader"></div><p class="text-center text-gray-500 font-bold">Mengambil data terkini...</p>';
        try {
            const response = await fetch(APPS_SCRIPT_URL);
            reportsData = await response.json();
            renderReports();
        } catch (error) {
            container.innerHTML = `<div class="text-center p-10 bg-red-50 rounded-xl border border-red-200 text-red-600 font-bold">Gagal menyambung ke server. Sila semak deployment Apps Script anda.</div>`;
        }
    }

    function renderReports() {
        const container = document.getElementById('reports-container');
        const selectedMonth = document.getElementById('monthFilter').value;
        const monthLabel = document.getElementById('monthFilter').options[document.getElementById('monthFilter').selectedIndex].text;
        
        container.innerHTML = `<div class="mb-6"><span class="bg-blue-100 text-blue-900 px-4 py-1.5 rounded-full font-black text-sm uppercase tracking-widest border border-blue-200">Bulan: ${monthLabel}</span></div>`;

        // Filter mengikut bulan
        const filtered = reportsData.filter(r => r.bulan === selectedMonth);

        if (filtered.length === 0) {
            container.innerHTML += `<div class='text-center text-gray-400 py-24 border-2 border-dashed rounded-2xl bg-gray-50'>Tiada rekod pelaporan dijumpai untuk bulan ${monthLabel}.</div>`;
            return;
        }

        // Grouping data mengikut Minggu
        const grouped = {};
        filtered.forEach(r => {
            const m = r.minggu || "Lain-lain";
            if(!grouped[m]) grouped[m] = [];
            grouped[m].push(r);
        });

        // Susun Minggu secara menaik
        const sortedWeeks = Object.keys(grouped).sort((a,b) => a-b);

        sortedWeeks.forEach(minggu => {
            let tableHtml = `
            <div class="mb-10 overflow-hidden border border-gray-200 rounded-xl shadow-sm bg-white">
                <div class="bg-blue-900 px-5 py-3 flex justify-between items-center">
                    <h4 class="text-white font-black uppercase tracking-widest text-xs">MINGGU ${minggu}</h4>
                    <span class="bg-blue-800 text-blue-200 px-3 py-1 rounded text-[10px] font-bold">${grouped[minggu].length} LAPORAN</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse table-fixed">
                        <thead>
                            <tr class="bg-gray-50 border-b">
                                <th class="w-32 px-5 py-4 text-xs font-bold text-gray-500 uppercase">Tarikh</th>
                                <th class="w-24 px-5 py-4 text-xs font-bold text-gray-500 uppercase">Hari</th>
                                <th class="px-5 py-4 text-xs font-bold text-gray-500 uppercase">Pelapor (Guru 1)</th>
                                <th class="w-28 px-5 py-4 text-center text-xs font-bold text-gray-500 uppercase">Fail</th>
                            </tr>
                        </thead>
                        <tbody class="divide-y divide-gray-100">`;
            
            grouped[minggu].forEach(row => {
                tableHtml += `
                            <tr class="hover:bg-blue-50/50 transition-colors">
                                <td class="px-5 py-4 whitespace-nowrap text-sm font-bold text-gray-700">${row.tarikh}</td>
                                <td class="px-5 py-4 whitespace-nowrap text-xs text-gray-500 font-semibold uppercase">${row.hari || '-'}</td>
                                <td class="px-5 py-4 text-sm font-black text-blue-800 uppercase truncate">${row.nama_guru}</td>
                                <td class="px-5 py-4 text-center">
                                    <a href="${row.url}" target="_blank" class="inline-flex items-center px-4 py-2 bg-red-600 text-white text-[10px] font-black rounded shadow-md hover:bg-red-700 transition-all uppercase tracking-tighter">
                                        LIHAT PDF
                                    </a>
                                </td>
                            </tr>`;
            });

            tableHtml += `</tbody></table></div></div>`;
            container.innerHTML += tableHtml;
        });
    }
  </script>
</body>
</html>
